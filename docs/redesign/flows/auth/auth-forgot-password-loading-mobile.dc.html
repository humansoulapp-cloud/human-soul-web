<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Source+Sans+3:wght@400;500;600&amp;family=DM+Sans:wght@500&amp;display=swap">

body{margin:0}

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 24px; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
<header style="display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex;">

<p class="text-body" style="margin: 0; color: var(--muted-foreground);">Enter the email you signed up with. We'll send you a link to choose a new password.</p>
</div>
<form aria-busy="true" style="display: flex; flex-direction: column; gap: 16px;">

</main>
<footer style="display: flex; justify-content: center;">
<p class="text-body-sm" style="margin: 0; display: flex; gap: 6px; color: var(--muted-foreground);">Remembered it? <x-import component-from-global-scope="HumanSoul.Button" variant="link" href="auth-sign-in-empty-mobile.dc.html">Sign In</x-import></p>

</div>
</x-dc>
