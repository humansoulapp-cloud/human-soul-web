<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forgot Password · Error · Desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/humansoul/tokens.css">
<link rel="stylesheet" href="ds/humansoul/components/bundle.css">
<script src="ds/humansoul/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Source+Sans+3:wght@400;500;600&amp;family=DM+Sans:wght@500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
<dc-import name="BrandPanel" hint-size="720px,900px"></dc-import>
<main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 64px;">
<div style="width: 400px; display: flex; flex-direction: column; gap: 32px;">
<div style="display: flex; justify-content: space-between; align-items: center;">
<x-import component-from-global-scope="HumanSoul.Logo" size="{{logo}}"></x-import>
<x-import component-from-global-scope="HumanSoul.Button" variant="ghost" size="sm" icon="arrowLeft" href="Main.dc.html">Back to Sign In</x-import>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<h1 class="text-h1" style="margin: 0;">Forgot your password?</h1>
<p class="text-body" style="margin: 0; color: var(--muted-foreground);">Enter the email you signed up with. We'll send you a link to choose a new password.</p>
</div>
<form style="display: flex; flex-direction: column; gap: 16px;">
<x-import component-from-global-scope="HumanSoul.TextField" label="Email address" type="email" name="email" default-value="ana.ruiz@example" auto-complete="email" required="{{yes}}" error="Enter a full email address, for example ana@example.com."></x-import>
<x-import component-from-global-scope="HumanSoul.Button" type="submit" size="lg" full="{{yes}}">Send reset link</x-import>
</form>
<p class="text-body-sm" style="margin: 0; display: flex; gap: 6px; justify-content: center; color: var(--muted-foreground);">Remembered it? <x-import component-from-global-scope="HumanSoul.Button" variant="link" href="Main.dc.html">Sign In</x-import></p>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true, logo: 28 };
}
}
</script>
</body>
</html>
