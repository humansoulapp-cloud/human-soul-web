<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign Up · Loading · Mobile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/humansoul/tokens.css">
<link rel="stylesheet" href="ds/humansoul/components/bundle.css">
<script src="ds/humansoul/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Source+Sans+3:wght@400;500;600&amp;family=DM+Sans:wght@500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 40px 16px 28px; display: flex; flex-direction: column; gap: 28px; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
<header style="display: flex; justify-content: center;">
<x-import component-from-global-scope="HumanSoul.Logo" size="{{logo}}"></x-import>
</header>
<main style="display: flex; flex-direction: column; gap: 24px; flex: 1;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<h1 class="text-h2" style="margin: 0;">Begin Your Space</h1>
<p class="text-body" style="margin: 0; color: var(--muted-foreground);">A quiet, private place to notice yourself.</p>
</div>
<form aria-busy="true" style="display: flex; flex-direction: column; gap: 16px;">
<x-import component-from-global-scope="HumanSoul.TextField" label="Name" optional="{{yes}}" name="name" default-value="Ana" disabled="{{yes}}"></x-import>
<x-import component-from-global-scope="HumanSoul.TextField" label="Email address" type="email" name="email" default-value="ana.ruiz@example.com" disabled="{{yes}}"></x-import>
<x-import component-from-global-scope="HumanSoul.TextField" label="Password" type="password" name="password" default-value="quietmorning" hint="At least 6 characters." disabled="{{yes}}"></x-import>
<x-import component-from-global-scope="HumanSoul.TextField" label="Confirm password" type="password" name="confirm" default-value="quietmorning" disabled="{{yes}}"></x-import>
<x-import component-from-global-scope="HumanSoul.Button" type="submit" size="lg" full="{{yes}}" loading="{{yes}}">Creating account…</x-import>
</form>
</main>
<footer style="display: flex; justify-content: center;">
<p class="text-body-sm" style="margin: 0; display: flex; gap: 6px; color: var(--muted-foreground);">Already have an account? <x-import component-from-global-scope="HumanSoul.Button" variant="link" href="auth-sign-in-empty-mobile.dc.html">Sign In</x-import></p>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true, logo: 28 };
}
}
</script>
</body>
</html>
