<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reset Password · Empty · Mobile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/humansoul/tokens.css">
<link rel="stylesheet" href="ds/humansoul/components/bundle.css">
<script src="ds/humansoul/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Source+Sans+3:wght@400;500;600&amp;family=DM+Sans:wght@500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 16px 32px; display: flex; flex-direction: column; gap: 32px; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
<header style="display: flex; justify-content: center;">
<x-import component-from-global-scope="HumanSoul.Logo" size="{{logo}}"></x-import>
</header>
<main style="display: flex; flex-direction: column; gap: 24px; flex: 1;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<h1 class="text-h2" style="margin: 0;">Choose a new password</h1>
<p class="text-body" style="margin: 0; color: var(--muted-foreground);">You'll stay signed in after you update it.</p>
</div>
<form style="display: flex; flex-direction: column; gap: 16px;">
<x-import component-from-global-scope="HumanSoul.TextField" label="New password" type="password" name="password" placeholder="Choose a password" hint="At least 6 characters." auto-complete="new-password" required="{{yes}}"></x-import>
<x-import component-from-global-scope="HumanSoul.TextField" label="Confirm new password" type="password" name="confirm" placeholder="Re-enter password" auto-complete="new-password" required="{{yes}}"></x-import>
<x-import component-from-global-scope="HumanSoul.Button" type="submit" size="lg" full="{{yes}}">Update password</x-import>
</form>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true, logo: 28 };
}
}
</script>
</body>
</html>
