<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reset Password · Loading · Desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/humansoul/tokens.css">
<link rel="stylesheet" href="ds/humansoul/components/bundle.css">
<script src="ds/humansoul/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Source+Sans+3:wght@400;500;600&amp;family=DM+Sans:wght@500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
<dc-import name="BrandPanel" hint-size="720px,900px"></dc-import>
<main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 64px;">
<div style="width: 400px; display: flex; flex-direction: column; gap: 32px;">
<x-import component-from-global-scope="HumanSoul.Logo" size="{{logo}}"></x-import>
<div style="display: flex; flex-direction: column; gap: 8px;">
<h1 class="text-h1" style="margin: 0;">Choose a new password</h1>
<p class="text-body" style="margin: 0; color: var(--muted-foreground);">You'll stay signed in after you update it.</p>
</div>
<form aria-busy="true" style="display: flex; flex-direction: column; gap: 16px;">
<x-import component-from-global-scope="HumanSoul.TextField" label="New password" type="password" name="password" default-value="stillwater" hint="At least 6 characters." disabled="{{yes}}"></x-import>
<x-import component-from-global-scope="HumanSoul.TextField" label="Confirm new password" type="password" name="confirm" default-value="stillwater" disabled="{{yes}}"></x-import>
<x-import component-from-global-scope="HumanSoul.Button" type="submit" size="lg" full="{{yes}}" loading="{{yes}}">Updating…</x-import>
</form>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true, logo: 28 };
}
}
</script>
</body>
</html>
