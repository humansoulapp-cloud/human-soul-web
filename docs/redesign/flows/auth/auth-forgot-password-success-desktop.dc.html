<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forgot Password · Success · Desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/humansoul/tokens.css">
<link rel="stylesheet" href="ds/humansoul/components/bundle.css">
<script src="ds/humansoul/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Source+Sans+3:wght@400;500;600&amp;family=DM+Sans:wght@500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
<dc-import name="BrandPanel" hint-size="720px,900px"></dc-import>
<main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 64px;">
<div style="width: 400px; display: flex; flex-direction: column; gap: 32px;">
<x-import component-from-global-scope="HumanSoul.Logo" size="{{logo}}"></x-import>
<div style="width: 64px; height: 64px; border-radius: var(--radius-lg); background: var(--accent); color: var(--accent-foreground); display: flex; align-items: center; justify-content: center;">
<x-import component-from-global-scope="HumanSoul.Icon" name="mail" size="{{iconSize}}"></x-import>
</div>
<div style="display: flex; flex-direction: column; gap: 12px;">
<h1 class="text-h1" style="margin: 0;">Check your email</h1>
<p class="text-body" style="margin: 0; color: var(--muted-foreground);">If an account exists for <strong style="color: var(--foreground); font-weight: 600;">ana.ruiz@example.com</strong>, you'll get a link to choose a new password in the next few minutes. The link works once, for one hour.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 16px;">
<x-import component-from-global-scope="HumanSoul.Button" size="lg" full="{{yes}}" href="Main.dc.html">Back to Sign In</x-import>
<p class="text-body-sm" style="margin: 0; display: flex; gap: 6px; justify-content: center; color: var(--muted-foreground);">Didn't get it? <x-import component-from-global-scope="HumanSoul.Button" variant="link">Resend link</x-import></p>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true, logo: 28, iconSize: 28 };
}
}
</script>
</body>
</html>
