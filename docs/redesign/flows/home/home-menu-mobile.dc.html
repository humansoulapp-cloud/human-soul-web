<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shell · Menu · Mobile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/humansoul/tokens.css">
<link rel="stylesheet" href="ds/humansoul/components/bundle.css">
<script src="ds/humansoul/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Source+Sans+3:wght@400;500;600&amp;family=DM+Sans:wght@500&amp;display=swap">
<style>
body{margin:0}
.menu-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 12px;border-radius:var(--radius-md);color:var(--foreground);text-decoration:none;font:500 16px/24px var(--font-sans)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
<dc-import name="HomeMobile" state="data" hint-size="390px,2600px"></dc-import>
<div style="position: absolute; inset: 0; background: color-mix(in srgb, var(--foreground) 40%, transparent); display: flex; flex-direction: column; justify-content: flex-end;">
<x-import component-from-global-scope="HumanSoul.Sheet" title="Menu">
<div style="display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; align-items: center; gap: 12px; padding: 4px 0 16px; border-bottom: 1px solid var(--border);">
<x-import component-from-global-scope="HumanSoul.Avatar" name="Ana Ruiz"></x-import>
<div style="display: flex; flex-direction: column;">
<span class="text-label">Ana Ruiz</span>
<span class="text-body-sm" style="color: var(--muted-foreground);">ana.ruiz@example.com</span>
</div>
</div>
<nav aria-label="More" style="display: flex; flex-direction: column; gap: 2px;">
<a class="menu-row" href="/subscription"><x-import component-from-global-scope="HumanSoul.Icon" name="sparkles"></x-import>Premium</a>
<a class="menu-row" href="/admin"><x-import component-from-global-scope="HumanSoul.Icon" name="shield"></x-import><span style="flex: 1;">Admin Panel</span><x-import component-from-global-scope="HumanSoul.Badge" variant="outline">Admins only</x-import></a>
<div class="menu-row"><x-import component-from-global-scope="HumanSoul.Switch" default-checked="{{no}}">Dark mode</x-import></div>
</nav>
<div style="padding-top: 16px; border-top: 1px solid var(--border);">
<x-import component-from-global-scope="HumanSoul.Button" variant="outline" size="lg" icon="logout" full="{{yes}}">Sign Out</x-import>
</div>
</div>
</x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true, no: false };
}
}
</script>
</body>
</html>
