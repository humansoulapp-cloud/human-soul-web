<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home · Create journal · Desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/humansoul/tokens.css">
<link rel="stylesheet" href="ds/humansoul/components/bundle.css">
<script src="ds/humansoul/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Source+Sans+3:wght@400;500;600&amp;family=DM+Sans:wght@500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; min-height: 1240px; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
<dc-import name="Main" state="data" hint-size="1440px,1240px"></dc-import>
<div style="position: absolute; inset: 0; background: color-mix(in srgb, var(--foreground) 40%, transparent); display: flex; justify-content: center; align-items: flex-start; padding-top: 200px;">
<x-import component-from-global-scope="HumanSoul.Dialog" title="Create a journal" description="Give your journal a title to house and organize your reflections." style="width: 480px;">
<div style="display: flex; flex-direction: column; gap: 16px;">
<x-import component-from-global-scope="HumanSoul.TextField" label="Journal title" name="title" placeholder="e.g. Morning Thoughts, Deep Questions, Gratitude…" default-value="Morning Pages" required="{{yes}}" state="focus"></x-import>
<div style="display: flex; flex-direction: column; gap: 8px;">
<span class="text-overline" style="color: var(--muted-foreground);">Suggestions</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px;">
<x-import component-from-global-scope="HumanSoul.Chip" selected="{{yes}}">Morning Pages</x-import>
<x-import component-from-global-scope="HumanSoul.Chip">Gratitude &amp; Joy</x-import>
<x-import component-from-global-scope="HumanSoul.Chip">Mindful Moments</x-import>
<x-import component-from-global-scope="HumanSoul.Chip">Creative Sparks</x-import>
<x-import component-from-global-scope="HumanSoul.Chip">Travel &amp; Wonder</x-import>
<x-import component-from-global-scope="HumanSoul.Chip">Life Lessons</x-import>
<x-import component-from-global-scope="HumanSoul.Chip">Deep Questions</x-import>
<x-import component-from-global-scope="HumanSoul.Chip">Daily Musings</x-import>
</div>
</div>
<div style="display: flex; justify-content: flex-end; gap: 12px; padding-top: 16px; border-top: 1px solid var(--border);">
<x-import component-from-global-scope="HumanSoul.Button" variant="ghost">Cancel</x-import>
<x-import component-from-global-scope="HumanSoul.Button" icon="plus">Create Journal</x-import>
</div>
</div>
</x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1240}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true };
}
}
</script>
</body>
</html>
