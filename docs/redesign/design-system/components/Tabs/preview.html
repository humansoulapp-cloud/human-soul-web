<!-- @dsCard group="Navigation" height=330 subtitle="Filters (pills) and views (underline)" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Sans:wght@500&display=swap">
<style>
body{margin:0;padding:24px;background:var(--background);color:var(--foreground);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.cap{font:500 12px/16px var(--font-sans);color:var(--muted-foreground)}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
</style>
<div id="root"></div>
<script>
const H=window.HumanSoul, h=React.createElement;
const {Logo,Icon,Button,Field,Input,Textarea,Select,Checkbox,Switch,Chip,Badge,Card,Alert,Tabs,Dialog,Sheet,Skeleton,EmptyState,ErrorState,Sidebar,BottomNav,DataList,ReflectionCard,JournalCard,JourneyCard,Stat,Avatar,PageHeader}=H;
const C=(cap,node,style)=>h('div',{className:'col',style},h('span',{className:'cap'},cap),node);
const Row=(...c)=>h('div',{className:'row'},...c);
function App(){const [a,setA]=React.useState('all'),[b,setB]=React.useState('live'),[d,setD]=React.useState('3');
return h('div',{className:'stack',style:{maxWidth:640}},
 C('Journey categories (pills, horizontal scroll on mobile)',h(Tabs,{value:a,onChange:setA,items:[{value:'all',label:'All journeys'},{value:'f',label:'Foundations'},{value:'c',label:'Awareness & Reflection'},{value:'i',label:'Identity'},{value:'e',label:'Emotions'}]})),
 C('Days of a journey',h(Tabs,{value:d,onChange:setD,items:['1','2','3','4','5','6','7'].map(n=>({value:n,label:'Day '+n}))})),
 C('Journey status in admin (underline)',h(Tabs,{variant:'underline',value:b,onChange:setB,items:[{value:'all',label:'All',count:12},{value:'live',label:'Live',count:7},{value:'sch',label:'Scheduled',count:2},{value:'dr',label:'Drafts',count:2},{value:'ar',label:'Archived',count:1}]})));}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
