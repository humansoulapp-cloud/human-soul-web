<!-- @dsCard group="Forms" height=280 subtitle="Emotion tags, suggestions and filters" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Sans:wght@500&display=swap">
<style>
body{margin:0;padding:24px;background:var(--background);color:var(--foreground);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.cap{font:500 12px/16px var(--font-sans);color:var(--muted-foreground)}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
</style>
<div id="root"></div>
<script>
const H=window.HumanSoul, h=React.createElement;
const {Logo,Icon,Button,Field,Input,TextField,Textarea,Select,Checkbox,Switch,Chip,Badge,Card,Alert,Tabs,Dialog,Sheet,Skeleton,EmptyState,ErrorState,Sidebar,BottomNav,DataList,ReflectionCard,JournalCard,JourneyCard,Stat,Avatar,PageHeader}=H;
const C=(cap,node,style)=>h('div',{className:'col',style},h('span',{className:'cap'},cap),node);
const Row=(...c)=>h('div',{className:'row'},...c);
const tags=['Gratitude','Calm','Clarity','Tired','Hopeful','Uncertain','Peaceful','Reflective'];
function App(){const [sel,setSel]=React.useState(['Calm','Clarity']);
return h('div',{className:'stack'},
 C('Tags (multi-select)',h('div',{className:'row',style:{gap:8}},tags.map(t=>h(Chip,{key:t,selected:sel.includes(t),onClick:()=>setSel(s=>s.includes(t)?s.filter(x=>x!==t):[...s,t])},t)))),
 C('States',Row(h(Chip,null,'Default'),h(Chip,{state:'hover'},'Hover'),h(Chip,{state:'focus'},'Focus'),h(Chip,{selected:true},'Selected'),h(Chip,{state:'disabled',disabled:true},'Disabled'))),
 C('Suggestions',h('div',{className:'row',style:{gap:8}},['Morning Pages','Gratitude & Joy','Mindful Moments'].map(t=>h(Chip,{key:t,icon:'plus'},t)))));}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
