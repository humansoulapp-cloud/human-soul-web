<!-- @dsCard group="Data" height=280 subtitle="Base surface: default, interactive, dashed" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Sans:wght@500&display=swap">
<style>
body{margin:0;padding:24px;background:var(--background);color:var(--foreground);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.cap{font:500 12px/16px var(--font-sans);color:var(--muted-foreground)}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
</style>
<div id="root"></div>
<script>
const H=window.HumanSoul, h=React.createElement;
const {Logo,Icon,Button,Field,Input,TextField,Textarea,Select,Checkbox,Switch,Chip,Badge,Card,Alert,Tabs,Dialog,Sheet,Skeleton,EmptyState,ErrorState,Sidebar,BottomNav,DataList,ReflectionCard,JournalCard,JourneyCard,Stat,Avatar,PageHeader}=H;
const C=(cap,node,style)=>h('div',{className:'col',style},h('span',{className:'cap'},cap),node);
const Row=(...c)=>h('div',{className:'row'},...c);
function App(){return Row(
 C('Default',h('div',{style:{width:240}},h(Card,null,h('h3',{className:'text-h3',style:{margin:'0 0 6px'}},'Card'),h('p',{className:'text-body-sm',style:{margin:0,color:'var(--muted-foreground)'}},'Contenedor para una idea.')))),
 C('Interactive (hover)',h('div',{style:{width:240}},h(Card,{interactive:true,state:'hover'},h('h3',{className:'text-h3',style:{margin:'0 0 6px'}},'Card'),h('p',{className:'text-body-sm',style:{margin:0,color:'var(--muted-foreground)'}},'Lifts and highlights its border.')))),
 C('Dashed',h('div',{style:{width:240}},h(Card,{variant:'dashed'},h('h3',{className:'text-h3',style:{margin:'0 0 6px'}},'New Journal'),h('p',{className:'text-body-sm',style:{margin:0,color:'var(--muted-foreground)'}},'For create actions.')))));}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
