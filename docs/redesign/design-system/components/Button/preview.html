<!-- @dsCard group="Actions" height=640 subtitle="6 variants × default, hover, focus, disabled, loading" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Sans:wght@500&display=swap">
<style>
body{margin:0;padding:24px;background:var(--background);color:var(--foreground);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.cap{font:500 12px/16px var(--font-sans);color:var(--muted-foreground)}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
</style>
<div id="root"></div>
<script>
const H=window.HumanSoul, h=React.createElement;
const {Logo,Icon,Button,Field,Input,Textarea,Select,Checkbox,Switch,Chip,Badge,Card,Alert,Tabs,Dialog,Sheet,Skeleton,EmptyState,ErrorState,Sidebar,BottomNav,DataList,ReflectionCard,JournalCard,JourneyCard,Stat,Avatar,PageHeader}=H;
const C=(cap,node,style)=>h('div',{className:'col',style},h('span',{className:'cap'},cap),node);
const Row=(...c)=>h('div',{className:'row'},...c);
const V=[['default','Save reflection'],['secondary','Cancel'],['outline','Write'],['ghost','Read more'],['destructive','Delete'],['link','View details']];
const S=[['Default',{}],['Hover',{state:'hover'}],['Focus',{state:'focus'}],['Disabled',{disabled:true}],['Loading',{loading:true}]];
function App(){return h('div',{className:'stack'},
 h('div',{className:'grid',style:{gridTemplateColumns:'90px repeat(5,minmax(0,max-content))',alignItems:'center',columnGap:20}},
  h('span'),...S.map(s=>h('span',{key:s[0],className:'cap'},s[0])),
  ...V.flatMap(v=>[h('span',{key:v[0],className:'cap'},v[0]),...S.map(s=>h('div',{key:v[0]+s[0]},h(Button,{variant:v[0],...s[1]},v[1])))])),
 Row(C('Sizes',Row(h(Button,{size:'sm'},'Small'),h(Button,null,'Medium'),h(Button,{size:'lg'},'Large'))),
  C('With icon',Row(h(Button,{icon:'pen'},'Write now'),h(Button,{variant:'outline',size:'icon','aria-label':'Add',icon:'plus'}),h(Button,{variant:'ghost',size:'icon','aria-label':'Delete',icon:'trash'}))),
  C('Floating (mobile)',h(Button,{size:'fab','aria-label':'Write',icon:'pen'})),
  C('Full width (mobile)',h('div',{style:{width:280}},h(Button,{full:true},'Sign In'))))
);}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
