 {id:'a41c·7e02·91bd',role:h(Badge,{variant:'primary',icon:'shield'},'Admin'),joined:'Mar 12, 2026',act:h(Button,{variant:'outline',size:'sm'},'Revoke admin')},
 {id:'5d90·c3a8·02f7',role:h(Badge,null,'User'),joined:'Apr 28, 2026',act:h(Button,{variant:'outline',size:'sm'},'Make admin')},
