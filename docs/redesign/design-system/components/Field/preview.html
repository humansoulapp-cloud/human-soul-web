<!-- @dsCard group="Forms" height=220 subtitle="Label + control + hint or error" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Sans:wght@500&display=swap">
<style>
body{margin:0;padding:24px;background:var(--background);color:var(--foreground);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.cap{font:500 12px/16px var(--font-sans);color:var(--muted-foreground)}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
</style>
<div id="root"></div>
<script>
const H=window.HumanSoul, h=React.createElement;
const {Logo,Icon,Button,Field,Input,Textarea,Select,Checkbox,Switch,Chip,Badge,Card,Alert,Tabs,Dialog,Sheet,Skeleton,EmptyState,ErrorState,Sidebar,BottomNav,DataList,ReflectionCard,JournalCard,JourneyCard,Stat,Avatar,PageHeader}=H;
const C=(cap,node,style)=>h('div',{className:'col',style},h('span',{className:'cap'},cap),node);
const Row=(...c)=>h('div',{className:'row'},...c);
function App(){return Row(
 C('With hint',h('div',{style:{width:300}},h(Field,{label:'Name',optional:true,hint:'We will greet you with it on Home.'},h(Input,{placeholder:'Your name'})))),
 C('With error',h('div',{style:{width:300}},h(Field,{label:'Email address',error:'Enter a valid email address, for example ana@example.com.'},h(Input,{type:'email',defaultValue:'ana@example'})))));}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
